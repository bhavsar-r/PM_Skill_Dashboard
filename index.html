<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HUB Skills Assessment Tool</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>HUB Skills Assessment Tool</h1>

        <!-- Navigation -->

        <div class="navBar">

            <button
                id="assessmentBtn"
                class="active"
                onclick="showTab('assessmentTab')">
                Assessment
            </button>

            <button
                id="adminBtn"
                onclick="showTab('adminTab')">
                Admin
            </button>

            <button
                id="reportBtn"
                onclick="showTab('reportTab')">
                Reports
            </button>

        </div>

        <!-- Toolbar -->

        <div class="toolbar">

            <button onclick="exportAssessments()">
                Export Assessments
            </button>

            <button onclick="clearAllData()">
                Reset Database
            </button>

        </div>

        <!-- ===========================
             ASSESSMENT TAB
        =========================== -->

        <div id="assessmentTab">

            <div class="topSection">

                <div class="formArea">

                    <h2>Assessment Setup</h2>

                    <label>Employee Name</label>
                    <input
                        id="pmName"
                        type="text"
                        placeholder="Enter Employee Name">

                    <label>Job Code</label>
                    <select id="jobCode">
                        <option value="">Select Job Code</option>
                    </select>

                    <label>Team</label>
                    <select id="team">
                        <option value="">Select Team</option>
                    </select>

                    <button onclick="loadSkills()">
                        Load Assessment
                    </button>

                </div>

                <div class="descriptionArea">

                    <h2>Skill Descriptions</h2>

                    <div id="descriptions">

                        Select a Job Code and Team.

                    </div>

                </div>

            </div>

            <h2>Assessment</h2>

            <div class="tableContainer">
                <table id="assessmentTable">

                <thead>

                    <tr>

                        <th>Skill</th>
                        <th>Subskill</th>
                        <th>Minimum</th>
                        <th>Current Score</th>
                        <th>New Score</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>


            <br>

            <button id="submitBtn">
                Submit Assessment
            </button>

            </div> <!-- CLOSE assessmentTab -->

        <!-- ===========================
             ADMIN TAB
        =========================== -->

        <div id="adminTab" style="display:none">

            <h2>Add Skill / Subskill</h2>

            <select id="addJobCode">
                <option value="">
                    Select Job Code...
                </option>
            </select>

            <select id="addTeam">

                <option value="">
                    Select Team...
                </option>

            </select>

            <input
                id="addSkill"
                list="skillOptions"
                placeholder="Select Existing Skill or Enter New Skill">
            <datalist id="skillOptions"></datalist>

            <input id="addSubskill" placeholder="Subskill">

            <input id="addMinimum" placeholder="Minimum Score">

            <button onclick="addSkillSubskill()">
                Add Skill
            </button>

            <hr>

            <h2>Update Minimum</h2>

            <select id="minJobCode"></select>

            <select id="minTeam"></select>

            <select id="minSkill"></select>

            <input id="newMinimum" placeholder="Enter New Minimum">
            <button onclick="updateMinimum()">
                Update Minimum
            </button>

            <hr>

            <h2>Global Job Code Change</h2>

            <select id="oldJobCode"></select>

            <input id="newJobCode" placeholder="Enter New Job Code">

            <select id="jobTeam"></select>
            <button onclick="changeJobCode()">
                Change Job Code
            </button>

            <hr>

            <h2>Employee Job Code Change</h2>
            <select id="empName"></select>
            <select id="empCurrentJob"></select>
            <input id="empNewJob" placeholder="Enter New Job Code">
            <select id="empTeam"></select>
            <button onclick="changeEmployeeJobCode()">
                Update Employee
            </button>

        </div>

        <!-- ===========================
             REPORT TAB
        =========================== -->

        <div id="reportTab" style="display:none">

            <h2>Reports</h2>

            <button onclick="buildReport()">

                Refresh Report

            </button>

            <br><br>

<div class="reportFilters">

    <label>Team</label>
    <select id="reportTeam">
        <option value="">All Teams</option>
    </select>

    <label>Job Code</label>
    <select id="reportJobCode">
        <option value="">All Job Codes</option>
    </select>

    <label>Employee</label>
    <select id="reportPM">
        <option value="">All Employees</option>
    </select>

    <label>Sort By</label>

    <select id="reportSort">
        <option value="">Default</option>
        <option value="pm">Employee</option>
        <option value="team">Team</option>
        <option value="skill">Skill</option>
        <option value="jobcode">Job Code</option>
    </select>


</div>

<br>

<div id="reportResults"></div>

        </div>

    </div>

    <script src="descriptions.js"></script>
    <script src="script.js"></script>

</body>
</html>
